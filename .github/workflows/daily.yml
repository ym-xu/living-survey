name: Daily map

on:
  schedule:
    - cron: "0 6 * * *"     # every morning, 06:00 UTC
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write            # only to keep the schedule alive (see the last step before Build)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      fetch: ${{ steps.fetch.outcome }}
      broken: ${{ steps.build.outputs.broken }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.150.1"
          extended: true

      # The data is rebuilt every morning and never committed. The last good copy is
      # kept in the Actions cache, so an arXiv outage just means yesterday's map.
      - name: Restore yesterday's data
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            data/survey.json
            data/survey_cards.json
            data/fields
            scripts/.cache
          key: fields-${{ github.run_id }}
          restore-keys: fields-

      # One-off migration. A cache is tied to its exact path list, so the caches saved
      # before fields/ existed (key map-) only restore with the old list. Without this
      # the first run would start cold and redo every card made since the last commit.
      - name: Restore data saved before fields/ (first run after the move only)
        if: steps.restore.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: |
            data/survey.json
            data/survey_cards.json
            scripts/.cache
          key: map-${{ github.run_id }}
          restore-keys: map-

      - name: Move single-map data into its field
        run: |
          f=data/fields/document-understanding
          if [ -d fields/document-understanding ]; then
            mkdir -p "$f"
            for x in survey.json survey_cards.json; do
              if [ -f "data/$x" ]; then mv -f "data/$x" "$f/$x" && echo "moved data/$x -> $f/"; fi
            done
          fi

      # A broken change must never reach the live map: yesterday's page stays up instead.
      - name: Tests
        run: python3 -m unittest discover -s tests

      # Every field in fields/ (or the single map.toml). A field whose map.toml is broken
      # keeps yesterday's data; if it can't even be built it is left out of the site.
      # Either way the other fields still deploy, and the last job turns the run red.
      - name: Fetch papers from arXiv
        id: fetch
        continue-on-error: true
        run: python3 scripts/build.py fetch
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}       # optional: Semantic Scholar rate limit

      - name: Paper cards (Figure 4)
        continue-on-error: true                     # a failed card run never blocks the page
        run: python3 scripts/build.py cards
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}     # optional; without it Figure 4 keeps the cards it has
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}      # optional repository variables, default DeepSeek
          LLM_MODEL: ${{ vars.LLM_MODEL }}

      - name: Save today's data
        uses: actions/cache/save@v4
        with:
          path: |
            data/survey.json
            data/survey_cards.json
            data/fields
            scripts/.cache
          key: fields-${{ github.run_id }}

      # GitHub pauses scheduled workflows after 60 days without a commit.
      # Re-enabling the workflow through the API (no commit needed) keeps it running.
      - name: Keep the daily schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable"

      - name: Build
        id: build
        run: python3 scripts/build.py build --base-url "${{ steps.pages.outputs.base_url }}/"
        env:
          HUGO_PARAMS_REPO: ${{ github.server_url }}/${{ github.repository }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # After the deploy, so working fields are never held back: fail the run (GitHub then
  # emails the owner) when a field's fetch failed or a field was left out of the site.
  check:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Every field fetched and built
        env:
          FETCH: ${{ needs.build.outputs.fetch }}
          BROKEN: ${{ needs.build.outputs.broken }}
        run: |
          ok=1
          if [ "$FETCH" != "success" ]; then echo "::error::fetch failed for at least one field (see the build job)"; ok=0; fi
          if [ -n "$BROKEN" ]; then echo "::error::left out of the site: $BROKEN"; ok=0; fi
          [ "$ok" = 1 ]
